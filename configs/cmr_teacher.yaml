# Primary cardiac MRI teacher protocol described in the manuscript.
backbone: medsam2_heart
fusion_mode: hierarchical
spatial_pool: 4
transformer_heads: 8
transformer_depth: 2
transformer_dropout: 0.1
cross_attention_heads: 4
classification_columns: prevalent_I21,prevalent_I25,history_revasc,composite_cardiomyopathy_hf,prevalent_I48
regression_columns: LVEF,LVEDV,LVESV,LVSV,LV_CO,LVM,LV_WT,GLS,GCS,GRS,RVEF,RVEDV,RVESV,RVSV,LAEF,LA_max,LA_min,LASV,RAEF,RA_max,RA_min,RASV
classification_weight: 0.5
regression_weight: 0.5
focal_gamma: 2.0
epochs: 80
freeze_epochs: 3
warmup_epochs: 3
patience: 30
batch_size: 32
unfreeze_batch_size: 16
workers: 4
backbone_learning_rate: 1.0e-5
new_module_learning_rate: 1.0e-4
weight_decay: 0.1
min_learning_rate_ratio: 0.01
gradient_clip: 3.0
frame_dropout: 0.15
attention_dropout: 0.1
gradient_checkpointing: true
amp_dtype: bfloat16
seed: 42
