[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepcad-review-code"
version = "0.1.0"
description = "Training and model code accompanying the DeepCAD manuscript"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0",
  "Pillow>=10",
  "PyYAML>=6",
  "scikit-learn>=1.3",
  "timm>=0.9,<2",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["deepcad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
